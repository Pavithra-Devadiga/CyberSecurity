server.port=8080
spring.application.name=cybersecurity-backend

# CORS & Security
app.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
app.jwt.expiration-ms=86400000

# PostgreSQL (Production / Docker default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cybersecurity_db}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Scanner settings
scanner.connection.timeout-seconds=7
scanner.read.timeout-seconds=10
scanner.max.threads=4
scanner.safe-mode=true
scanner.zap.enabled=false
scanner.zap.base-url=${ZAP_BASE_URL:http://localhost:8090}
scanner.zap.api-key=${ZAP_API_KEY:}

# Fallback in-memory profile option
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
